<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>term</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%230f1512'/%3E%3Cpath d='M4 5l3 3-3 3M8.5 11H12' stroke='%2335c692' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="18" height="18"><path d="M4 5l3 3-3 3M8.5 11H12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="brand-name">term<span class="brand-dim"></span></span>
      </div>

      <nav class="sessions" id="sessions" aria-label="Sessions">
        <!-- Eintraege werden dynamisch gerendert -->
      </nav>

      <section class="links-panel" id="links-panel" hidden aria-label="Erkannte Links">
        <div class="links-head">Links</div>
        <ul class="links" id="links"></ul>
      </section>
    </aside>

    <main class="work">
      <div id="terminal"></div>
      <div class="conn-status" id="conn-status" hidden></div>
      <button class="fx-reopen" id="fx-reopen" hidden title="Dateien anzeigen">
        <span aria-hidden="true">‹</span> Dateien
      </button>
    </main>

    <aside class="explorer" id="explorer" aria-label="Dateien">
      <div class="fx-head">
        <span class="fx-title">Dateien</span>
        <div class="fx-head-actions">
          <button class="fx-btn" id="fx-refresh" title="Aktualisieren" aria-label="Aktualisieren">⟳</button>
          <button class="fx-btn" id="fx-collapse" title="Einklappen" aria-label="Einklappen">›</button>
        </div>
      </div>
      <div class="fx-crumbs" id="fx-crumbs" aria-label="Pfad"></div>
      <div class="fx-list" id="fx-list" aria-label="Dateiliste"></div>
      <div class="fx-status" id="fx-status" hidden></div>
      <div class="fx-drop" id="fx-drop" aria-hidden="true">Zum Hochladen ablegen</div>
    </aside>
  </div>

  <script type="module" src="app.bundle.js"></script>
</body>
</html>
